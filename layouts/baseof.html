<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip-link" href="#main">{{ if eq .Language.Lang "ko" }}본문으로 건너뛰기{{ else }}Skip to content{{ end }}</a>
<header class="site-header">
{{ partial "header.html" . }}
</header>
<main class="site-main" id="main">
{{ block "main" . }}{{ end }}
</main>
<footer class="site-footer">
{{ partial "footer.html" . }}
</footer>
</body>
</html>
