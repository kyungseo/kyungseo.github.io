baseURL = "https://kyungseo.github.io/"
title = "kyungseo"
defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
timeZone = "Asia/Seoul"

[languages]
  [languages.ko]
    languageCode = "ko-KR"
    languageName = "한국어"
    weight = 1
  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 2

[permalinks]
  [permalinks.page]
    posts = "/posts/:slug/"

[taxonomies]
  tag = "tags"
  series = "series"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    noClasses = false

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]

[params]
  description = "AI 에이전트, coding agent harness, 검증 가능한 개발 워크플로우에 대한 글과 기록"
  tagline = "AI 에이전트와 검증 가능한 개발 워크플로우"
  default_og_image = "/og-default.png"
