<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>바이브 코딩을 팀의 시스템으로</title>
  <desc>개인의 빠른 바이브 코딩이 구조, 패턴, 검증, 문서화 기준을 가진 하네스를 지나 팀이 계속 유지할 수 있는 SI 엔지니어링으로 이어지는 과정입니다.</desc>

  <defs>
    <filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#252B35" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11" markerHeight="11"
      markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="focus" stroke="#2E6DA4"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-positive" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11" markerHeight="11"
      markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="positive" stroke="#3F8F72"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="720" height="900" data-fill-role="canvas" fill="#F7F7F5"/>

  <!-- Header: the keyline covers only the two H1 line boxes. -->
  <g aria-label="제목">
    <rect x="36" y="54" width="4" height="82" rx="2" data-fill-role="focus" fill="#2E6DA4"/>
    <text x="52" y="47" font-size="14" font-weight="700" letter-spacing="0.09em"
      dominant-baseline="central" data-fill-role="muted" fill="#636A75">AI CODING · SI ENGINEERING</text>
    <text x="52" y="79" font-size="28" font-weight="700" dominant-baseline="central"
      data-fill-role="ink" fill="#252B35">바이브 코딩을</text>
    <text x="52" y="113" font-size="28" font-weight="700" dominant-baseline="central"
      data-fill-role="ink" fill="#252B35">팀의 시스템으로</text>
    <text x="52" y="145" font-size="14" dominant-baseline="central"
      data-fill-role="muted" fill="#636A75">속도는 에이전트가 높이고, 오래 유지되는 기준은 하네스가 지킵니다</text>
  </g>

  <!-- Step 1: fast solo work -->
  <g aria-label="개인의 바이브 코딩">
    <rect x="60" y="188" width="600" height="122" rx="18" data-fill-role="surface" fill="#FFFFFF"
      data-stroke-role="rule" stroke="#DEE0E2" stroke-width="1" filter="url(#soft-shadow)"/>
    <circle cx="106" cy="249" r="25" data-fill-role="icon-tint" fill="#EAF0F6"/>
    <g data-icon-id="terminal" transform="translate(91 234) scale(1.25)" fill="none"
      data-stroke-role="focus" stroke="#2E6DA4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.5 4 H18.5 A2.5 2.5 0 0 1 21 6.5 V17.5 A2.5 2.5 0 0 1 18.5 20 H5.5 A2.5 2.5 0 0 1 3 17.5 V6.5 A2.5 2.5 0 0 1 5.5 4 M7 9 L10 12 L7 15 M13 15 H17"/>
    </g>
    <text x="150" y="224" font-size="13" font-weight="700" letter-spacing="0.08em"
      dominant-baseline="central" data-fill-role="focus" fill="#2E6DA4">01 · 개인</text>
    <text x="150" y="252" font-size="20" font-weight="700" dominant-baseline="central"
      data-fill-role="ink" fill="#252B35">아이디어를 빠르게 코드로 만듭니다</text>
    <text x="150" y="281" font-size="14" dominant-baseline="central"
      data-fill-role="muted" fill="#636A75">하지만 작업마다 구조와 설명 방식이 달라지면 팀이 이어받기 어렵습니다</text>
  </g>

  <path d="M360 310 V336" fill="none" data-stroke-role="focus" stroke="#2E6DA4" stroke-width="2.5"
    stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 2: the harness -->
  <g aria-label="하네스가 경계를 붙잡습니다">
    <rect x="44" y="344" width="632" height="286" rx="20" data-fill-role="surface" fill="#FFFFFF"
      data-stroke-role="focus" stroke="#2E6DA4" stroke-width="2" filter="url(#soft-shadow)"/>
    <circle cx="84" cy="386" r="20" data-fill-role="surface-tint" fill="#E4EDF3"/>
    <g data-icon-id="shield" transform="translate(72 374)" fill="none" data-stroke-role="focus"
      stroke="#2E6DA4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3 L20 6 V12 C20 17 16 20 12 21 C8 20 4 17 4 12 V6 Z"/>
    </g>
    <text x="118" y="376" font-size="13" font-weight="700" letter-spacing="0.08em"
      dominant-baseline="central" data-fill-role="focus" fill="#2E6DA4">02 · 하네스</text>
    <text x="118" y="404" font-size="20" font-weight="700" dominant-baseline="central"
      data-fill-role="ink" fill="#252B35">팀이 지켜야 할 경계를 코드 밖에 세웁니다</text>

    <g aria-label="구조와 패턴">
      <rect x="72" y="438" width="276" height="68" rx="13" data-fill-role="edge-fill" fill="#EAF0F6"/>
      <circle cx="103" cy="472" r="18" data-fill-role="surface" fill="#FFFFFF"/>
      <g data-icon-id="layers" transform="translate(91 460)" fill="none" data-stroke-role="focus"
        stroke="#2E6DA4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 L21 8 L12 13 L3 8 Z M3 13 L12 18 L21 13"/>
      </g>
      <text x="132" y="464" font-size="16" font-weight="700" dominant-baseline="central"
        data-fill-role="ink" fill="#252B35">구조·패턴</text>
      <text x="132" y="486" font-size="13" dominant-baseline="central"
        data-fill-role="muted" fill="#636A75">어디에, 어떤 방식으로 만들지</text>
    </g>

    <g aria-label="작업 범위와 반복 규칙">
      <rect x="372" y="438" width="276" height="68" rx="13" data-fill-role="compute-fill" fill="#ECF4F1"/>
      <circle cx="403" cy="472" r="18" data-fill-role="surface" fill="#FFFFFF"/>
      <g data-icon-id="loop" transform="translate(391 460)" fill="none" data-stroke-role="positive"
        stroke="#3F8F72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12 A7.5 7.5 0 0 1 17.3 6.7 L20 9 M20 3.5 V9 H14.5 M19.5 12 A7.5 7.5 0 0 1 6.7 17.3 L4 15 M4 20.5 V15 H9.5"/>
      </g>
      <text x="432" y="464" font-size="16" font-weight="700" dominant-baseline="central"
        data-fill-role="ink" fill="#252B35">범위·반복</text>
      <text x="432" y="486" font-size="13" dominant-baseline="central"
        data-fill-role="muted" fill="#636A75">무엇을 바꾸고 어디서 멈출지</text>
    </g>

    <g aria-label="검증과 승인">
      <rect x="72" y="522" width="276" height="68" rx="13" data-fill-role="compute-fill" fill="#ECF4F1"/>
      <circle cx="103" cy="556" r="18" data-fill-role="surface" fill="#FFFFFF"/>
      <g data-icon-id="check" transform="translate(91 544)" fill="none" data-stroke-role="positive"
        stroke="#3F8F72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12 L10 18 L20 6"/>
      </g>
      <text x="132" y="548" font-size="16" font-weight="700" dominant-baseline="central"
        data-fill-role="ink" fill="#252B35">검증·승인</text>
      <text x="132" y="570" font-size="13" dominant-baseline="central"
        data-fill-role="muted" fill="#636A75">성공으로 볼 수 있는 조건</text>
    </g>

    <g aria-label="문서와 인계">
      <rect x="372" y="522" width="276" height="68" rx="13" data-fill-role="surface-tint" fill="#E4EDF3"/>
      <circle cx="403" cy="556" r="18" data-fill-role="surface" fill="#FFFFFF"/>
      <g data-icon-id="doc" transform="translate(391 544)" fill="none" data-stroke-role="focus"
        stroke="#2E6DA4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3 H14 L18 7 V21 H6 Z M14 3 V7 H18 M9 13 H15 M9 16.5 H15 M9 9.5 H11"/>
      </g>
      <text x="432" y="548" font-size="16" font-weight="700" dominant-baseline="central"
        data-fill-role="ink" fill="#252B35">문서·인계</text>
      <text x="432" y="570" font-size="13" dominant-baseline="central"
        data-fill-role="muted" fill="#636A75">다른 사람이 이어서 고칠 수 있게</text>
    </g>

    <text x="360" y="612" font-size="13" text-anchor="middle" dominant-baseline="central"
      data-fill-role="muted" fill="#636A75">에이전트의 자유를 없애는 것이 아니라, 팀의 약속 안에서 움직이게 합니다</text>
  </g>

  <path d="M360 630 V654" fill="none" data-stroke-role="positive" stroke="#3F8F72" stroke-width="2.5"
    stroke-linecap="round" marker-end="url(#arrow-positive)"/>

  <!-- Step 3: maintainable team result -->
  <g aria-label="팀이 이어서 유지하는 SI 엔지니어링">
    <rect x="60" y="662" width="600" height="110" rx="18" data-fill-role="compute-band" fill="#F7FBF9"
      data-stroke-role="positive" stroke="#3F8F72" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <circle cx="106" cy="717" r="25" data-fill-role="compute-fill" fill="#ECF4F1"/>
    <g data-icon-id="users" transform="translate(91 702) scale(1.25)" fill="none"
      data-stroke-role="positive" stroke="#3F8F72" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 11 A3 3 0 1 0 8 5 A3 3 0 1 0 8 11 M2 20 A6 6 0 0 1 14 20 M16 6 A3 3 0 0 1 16 11 M15 20 A6 6 0 0 0 22 20"/>
    </g>
    <text x="150" y="692" font-size="13" font-weight="700" letter-spacing="0.08em"
      dominant-baseline="central" data-fill-role="positive" fill="#3F8F72">03 · 팀</text>
    <text x="150" y="720" font-size="20" font-weight="700" dominant-baseline="central"
      data-fill-role="ink" fill="#252B35">누가 이어받아도 이해하고 수정할 수 있습니다</text>
    <text x="150" y="749" font-size="14" dominant-baseline="central"
      data-fill-role="muted" fill="#636A75">빠른 생성이 일회성 결과가 아니라 팀의 지속 가능한 자산이 됩니다</text>
  </g>

  <!-- Bottom support and footer use the resolved PageFrame regions. -->
  <g aria-label="핵심 메시지">
    <rect x="36" y="796" width="648" height="50" rx="12" data-fill-role="strip" fill="#F7F9FB"
      data-stroke-role="rule" stroke="#DEE0E2" stroke-width="1"/>
    <circle cx="64" cy="821" r="14" data-fill-role="surface-tint" fill="#E4EDF3"/>
    <g data-icon-id="route" transform="translate(54 811) scale(0.83)" fill="none" data-stroke-role="focus"
      stroke="#2E6DA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 19 H12 A4 4 0 0 0 12 11 H8 A4 4 0 0 1 8 3 H19"/>
    </g>
    <text x="88" y="821" font-size="15" font-weight="700" dominant-baseline="central"
      data-fill-role="ink" fill="#252B35">루프와 그래프는 그다음입니다. 출발점은 잘 설계된 하네스입니다.</text>
  </g>

  <text x="36" y="870" font-size="12" dominant-baseline="central" data-fill-role="muted" fill="#636A75">VIBE CODING × HARNESS × TEAM ENGINEERING</text>
  <text x="684" y="870" font-size="12" text-anchor="end" dominant-baseline="central" data-fill-role="muted" fill="#636A75">kyungseo.github.io</text>
</svg>
