<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>Lock the semantic contract; adapt delivery to the reader</title>
  <desc>The writing-quality-editor framework locks the semantic contract, preserves the author's voice by default, and adapts register and detail to the reader across Compose, Assess, Revise, and Adapt modes. A no-edit gate changed 25 of 34 reviewed READMEs and preserved 9.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#2B3659" flood-opacity=".10"/>
    </filter>
    <symbol id="ic-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
    </symbol>
    <symbol id="ic-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12h3l2-6 4 12 3-9 2 6h4"/>
    </symbol>
    <symbol id="ic-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h10M18 6h2M4 12h3M11 12h9M4 18h7M15 18h5"/><circle cx="16" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="13" cy="18" r="2"/>
    </symbol>
    <symbol id="ic-compose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20l4.2-1 10.6-10.6a2 2 0 0 0-2.8-2.8L5.4 16.2z"/><path d="M14.5 7.2l2.8 2.8"/>
    </symbol>
    <symbol id="ic-assess" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.2 15.2L21 21"/>
    </symbol>
    <symbol id="ic-revise" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h12M4 11h9M4 16h7"/><path d="M14 18l5.5-5.5 2 2L16 20h-2z"/>
    </symbol>
    <symbol id="ic-adapt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h11M11 3l4 4-4 4M20 17H9M13 13l-4 4 4 4"/>
    </symbol>
  </defs>
  <style>
    svg{--bg:#F8F9FC;--ink:#182235;--muted:#626A7A;--hair:#D3D8E4;--violet:#6658B3;--violet-dark:#443989;--violet-soft:#EEEAFB;--blue:#2B70A6;--blue-soft:#E8F2FA;--teal:#087D70;--teal-dark:#075C54;--teal-soft:#E5F4F0;--amber:#A9691B;--amber-soft:#FFF1DD;--card:#FFFFFF}
    .ink{fill:var(--ink)}.muted{fill:var(--muted)}.violet{fill:var(--violet)}.violet-dark{fill:var(--violet-dark)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.teal-dark{fill:var(--teal-dark)}.amber{fill:var(--amber)}.on-accent{fill:#FFFFFF}
    .h1{font-size:46px;font-weight:800;letter-spacing:-1.5px}.eyebrow{font-size:16px;font-weight:750;letter-spacing:1.1px}.subtitle{font-size:19px;font-weight:500}.section{font-size:24px;font-weight:800}.card-title{font-size:25px;font-weight:800}.body{font-size:19px;font-weight:520}.caption{font-size:16px;font-weight:600}.small{font-size:14px;font-weight:650}.stat{font-size:38px;font-weight:850}
  </style>
  <rect width="1080" height="1350" fill="var(--bg)"/>

  <g data-layout-role="page-title-header" data-layout-rail-padding-top="16" data-layout-rail-padding-bottom="0" data-layout-subtitle-gap="12" data-layout-tolerance="2">
    <rect data-layout-role="title-rail" x="60" y="48" width="6" height="143" rx="3" fill="var(--violet)"/>
    <text data-layout-role="title-eyebrow" x="88" y="72" font-size="16" dominant-baseline="middle" class="violet eyebrow">SKILLSTEAD · WRITING-QUALITY-EDITOR</text>
    <text data-layout-role="title-line" x="88" y="117" font-size="46" dominant-baseline="middle" class="ink h1">Lock the semantic contract;</text>
    <text data-layout-role="title-line" x="88" y="168" font-size="46" dominant-baseline="middle" class="ink h1">adapt delivery to the reader</text>
    <text data-layout-role="title-subtitle" x="88" y="212.5" font-size="19" dominant-baseline="middle" class="muted subtitle">A 3-layer framework that prevents meaning drift</text>
  </g>

  <rect x="60" y="258" width="960" height="602" rx="24" fill="#F1EEFC" stroke="#C5BDEB" stroke-width="1.5"/>
  <rect x="88" y="238" width="216" height="44" rx="22" fill="var(--violet)"/>
  <text x="196" y="260" text-anchor="middle" dominant-baseline="central" class="on-accent caption">3-LAYER CONTRACT</text>

  <text x="100" y="316" class="violet-dark section">Edit authority narrows toward the core</text>

  <g filter="url(#shadow)">
    <rect x="100" y="352" width="880" height="448" rx="22" fill="var(--card)" stroke="#AFA4E1" stroke-width="1.5"/>
  </g>
  <path d="M122 352H958A22 22 0 0 1 980 374V452H100V374A22 22 0 0 1 122 352Z" fill="var(--violet-soft)"/>
  <path d="M100 452H980" stroke="#AFA4E1"/>
  <circle cx="145" cy="402" r="27" fill="#DDD6F7"/>
  <use href="#ic-sliders" x="129" y="386" width="32" height="32" style="color:#6658B3"/>
  <text x="188" y="388" dominant-baseline="central" class="violet-dark card-title">Register and detail</text>
  <text x="188" y="424" dominant-baseline="central" class="muted caption">Adapt order, density, and terms to readers</text>
  <rect x="814" y="381" width="132" height="42" rx="21" fill="var(--violet)"/>
  <text x="880" y="402" text-anchor="middle" dominant-baseline="central" class="on-accent caption">ADJUST</text>

  <rect x="164" y="482" width="752" height="270" rx="20" fill="#EEF6FC" stroke="#96BBD6" stroke-width="1.5"/>
  <path d="M184 482H896A20 20 0 0 1 916 502V582H164V502A20 20 0 0 1 184 482Z" fill="var(--blue-soft)"/>
  <path d="M164 582H916" stroke="#96BBD6"/>
  <circle cx="207" cy="532" r="25" fill="#D7EAF7"/>
  <use href="#ic-wave" x="192" y="517" width="30" height="30" style="color:#2B70A6"/>
  <text x="247" y="516" dominant-baseline="central" class="blue card-title">Author's voice</text>
  <text x="247" y="552" dominant-baseline="central" class="muted caption">Keep by default unless asked to change</text>
  <rect x="770" y="511" width="118" height="42" rx="21" fill="var(--blue)"/>
  <text x="829" y="532" text-anchor="middle" dominant-baseline="central" class="on-accent caption">KEEP</text>

  <rect x="228" y="612" width="624" height="114" rx="18" fill="var(--teal-dark)" stroke="#064C45" stroke-width="2"/>
  <circle cx="284" cy="669" r="30" fill="#D7EFE9"/>
  <use href="#ic-lock" x="265" y="650" width="38" height="38" style="color:#087D70"/>
  <text x="334" y="640" dominant-baseline="central" class="on-accent card-title">Semantic contract</text>
  <text x="334" y="672" dominant-baseline="central" class="on-accent body">Facts · numbers · IDs · exceptions · risks</text>
  <text x="334" y="704" dominant-baseline="central" class="on-accent caption">Polishing does not authorize meaning changes</text>
  <rect x="736" y="650" width="90" height="40" rx="20" fill="#D7EFE9"/>
  <text x="781" y="670" text-anchor="middle" dominant-baseline="central" class="teal-dark caption">LOCK</text>

  <text x="540" y="777" text-anchor="middle" dominant-baseline="central" class="muted caption">Adapt the outside · never change the core without approval</text>

  <rect x="60" y="906" width="960" height="228" rx="22" fill="#F2F7FB" stroke="#B9CDDE" stroke-width="1.5"/>
  <rect x="88" y="886" width="300" height="44" rx="22" fill="var(--blue)"/>
  <text x="238" y="908" text-anchor="middle" dominant-baseline="central" class="on-accent caption">4 MODES · AUTHORITY LEVELS</text>

  <g>
    <rect x="92" y="964" width="207" height="124" rx="14" fill="var(--card)" stroke="#9BBBD1"/>
    <circle cx="128" cy="1002" r="23" fill="var(--blue-soft)"/>
    <use href="#ic-compose" x="114" y="988" width="28" height="28" style="color:#2B70A6"/>
    <text x="165" y="1002" dominant-baseline="central" class="blue card-title">Compose</text>
    <text x="116" y="1054" dominant-baseline="central" class="muted caption">Draft from evidence</text>
  </g>
  <g>
    <rect x="321" y="964" width="207" height="124" rx="14" fill="var(--card)" stroke="#9BBBD1"/>
    <circle cx="357" cy="1002" r="23" fill="var(--blue-soft)"/>
    <use href="#ic-assess" x="343" y="988" width="28" height="28" style="color:#2B70A6"/>
    <text x="394" y="1002" dominant-baseline="central" class="blue card-title">Assess</text>
    <text x="345" y="1054" dominant-baseline="central" class="muted caption">Diagnose · no edits</text>
  </g>
  <g>
    <rect x="550" y="964" width="207" height="124" rx="14" fill="var(--card)" stroke="#AFA4E1"/>
    <circle cx="586" cy="1002" r="23" fill="var(--violet-soft)"/>
    <use href="#ic-revise" x="572" y="988" width="28" height="28" style="color:#6658B3"/>
    <text x="623" y="1002" dominant-baseline="central" class="violet card-title">Revise</text>
    <text x="574" y="1054" dominant-baseline="central" class="muted caption">Revise one language</text>
  </g>
  <g>
    <rect x="779" y="964" width="207" height="124" rx="14" fill="var(--card)" stroke="#D9B071"/>
    <circle cx="815" cy="1002" r="23" fill="var(--amber-soft)"/>
    <use href="#ic-adapt" x="801" y="988" width="28" height="28" style="color:#A9691B"/>
    <text x="852" y="1002" dominant-baseline="central" class="amber card-title">Adapt</text>
    <text x="803" y="1054" dominant-baseline="central" class="muted caption">Rewrite EN↔KO</text>
  </g>

  <rect x="60" y="1178" width="960" height="130" rx="22" fill="#EDF8F4" stroke="#9BCFC3" stroke-width="1.5"/>
  <rect x="92" y="1192" width="156" height="34" rx="17" fill="var(--teal)"/>
  <text x="170" y="1209" text-anchor="middle" dominant-baseline="central" class="on-accent small">NO-EDIT GATE</text>
  <line x1="565" y1="1202" x2="565" y2="1284" stroke="#B5DCD3"/>
  <text x="650" y="1248" text-anchor="middle" dominant-baseline="central" class="blue stat">34</text>
  <text x="650" y="1280" text-anchor="middle" dominant-baseline="central" class="muted small">READMEs reviewed</text>
  <text x="800" y="1248" text-anchor="middle" dominant-baseline="central" class="teal stat">25</text>
  <text x="800" y="1280" text-anchor="middle" dominant-baseline="central" class="muted small">changed</text>
  <text x="936" y="1248" text-anchor="middle" dominant-baseline="central" class="violet stat">9</text>
  <text x="936" y="1280" text-anchor="middle" dominant-baseline="central" class="muted small">preserved</text>
  <text x="92" y="1252" class="teal section">Edit only when readers have a problem</text>
  <text x="92" y="1285" class="muted body">Preserve boundaries before counting edits</text>
</svg>
