<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img"
  style="font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>결함 있는 그림을 성공한 결과로 처리하지 않는 생성 흐름</title>
  <desc>서비스 구조 요청을 받아 그림을 만든 뒤 빠진 박스, 넘친 글자, 잘못된 아이콘과 달라진 폰트를 확인하고, 문제가 없으면 SVG와 receipt를 남기며 문제가 있으면 멈추거나 여러 장으로 나누는 흐름.</desc>
  <rect width="720" height="900" data-fill-role="canvas" fill="#F7F7F5"/>

  <g data-layout-role="header-cluster" data-layout-content-top="154" data-layout-breathing="36" data-layout-tolerance="2">
    <rect x="36" y="52.2" width="4" height="47.6" rx="2" data-layout-role="cluster-keyline" data-fill-role="focus" fill="#2E6DA4"/>
    <text x="52" y="44" font-size="14" font-weight="700" letter-spacing="0.08em" dominant-baseline="central"
      data-layout-role="cluster-eyebrow" data-fill-role="muted" fill="#636A75">SVG-INFOGRAPHIC 0.10.0</text>
    <text x="52" y="76" font-size="28" font-weight="700" dominant-baseline="central"
      data-layout-role="cluster-h1" data-fill-role="ink" fill="#252B35">결함 있는 그림을 성공한 결과로 처리하지 않는다</text>
    <text x="52" y="110" font-size="14" dominant-baseline="central"
      data-layout-role="cluster-subtitle" data-fill-role="muted" fill="#636A75">요청 → 생성·검사 → 결과</text>
  </g>

  <defs>
    <marker id="ah-focus" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11.25" markerHeight="11.25"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" data-stroke-role="focus" stroke="#2E6DA4" fill="none" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-positive" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11.25" markerHeight="11.25"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" data-stroke-role="positive" stroke="#3F8F72" fill="none" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-warning" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11.25" markerHeight="11.25"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" data-stroke-role="warning" stroke="#B08434" fill="none" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g data-layer="containers">
    <g data-layout-group="result-row" data-distribution="equal-gap" data-axis="x" data-group-count="2"></g>
  </g>

  <g data-layer="connectors" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 272 V302" data-stroke-role="focus" stroke="#2E6DA4" stroke-width="2.5" marker-end="url(#ah-focus)"/>
    <path d="M360 548 V576 H196 V596" data-stroke-role="positive" stroke="#3F8F72" stroke-width="2.5" marker-end="url(#ah-positive)"/>
    <path d="M360 548 V576 H524 V596" data-stroke-role="warning" stroke="#B08434" stroke-width="2.5" marker-end="url(#ah-warning)"/>
  </g>

  <g data-layer="nodes">
    <g data-entity="request">
      <rect x="56" y="164" width="608" height="108" rx="18" data-fill-role="surface" fill="#FFFFFF"
        data-stroke-role="rule" stroke="#DEE0E2" stroke-width="1"/>
      <circle cx="112" cy="218" r="28" data-fill-role="icon-tint" fill="#EAF0F6"/>
      <g data-icon-id="terminal" transform="translate(96 202) scale(1.3333)">
        <path d="M5.5 4 H18.5 A2.5 2.5 0 0 1 21 6.5 V17.5 A2.5 2.5 0 0 1 18.5 20 H5.5 A2.5 2.5 0 0 1 3 17.5 V6.5 A2.5 2.5 0 0 1 5.5 4 M7 9 L10 12 L7 15 M13 15 H17"
          data-stroke-role="focus" stroke="#2E6DA4" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="160" y="204" font-size="20" font-weight="700" dominant-baseline="central" data-fill-role="ink" fill="#252B35">“서비스 구조를 그려 줘”</text>
      <text x="160" y="236" font-size="14" dominant-baseline="central" data-fill-role="muted" fill="#636A75">사람이 자연어로 요청</text>
    </g>

    <g data-entity="build-and-check">
      <rect x="56" y="312" width="608" height="236" rx="18" data-fill-role="surface" fill="#FFFFFF"
        data-stroke-role="focus" stroke="#2E6DA4" stroke-width="2"/>
      <circle cx="112" cy="360" r="28" data-fill-role="icon-tint" fill="#EAF0F6"/>
      <g data-icon-id="shield" transform="translate(96 344) scale(1.3333)">
        <path d="M12 3 L20 6 V12 C20 17 16 20 12 21 C8 20 4 17 4 12 V6 Z" data-stroke-role="focus" stroke="#2E6DA4"
          fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="160" y="348" font-size="20" font-weight="700" dominant-baseline="central" data-fill-role="ink" fill="#252B35">그림을 만들고 다시 확인</text>
      <text x="160" y="378" font-size="14" dominant-baseline="central" data-fill-role="muted" fill="#636A75">눈으로 놓치기 쉬운 구조 오류를 먼저 찾는다</text>

      <g data-layout-group="check-grid-top" data-distribution="equal-gap" data-axis="x" data-group-count="2"></g>
      <g data-layout-group="check-grid-bottom" data-distribution="equal-gap" data-axis="x" data-group-count="2"></g>
      <g>
        <rect x="88" y="414" width="260" height="48" rx="12" data-layout-item="check-grid-top" data-fill-role="strip" fill="#F7F9FB" data-stroke-role="rule" stroke="#DEE0E2"/>
        <circle cx="112" cy="438" r="12" data-fill-role="icon-tint" fill="#EAF0F6"/>
        <path d="M106 438 L110 442 L118 433" data-stroke-role="focus" stroke="#2E6DA4" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="136" y="438" font-size="14" dominant-baseline="central" data-fill-role="ink" fill="#252B35">빠진 박스가 있나</text>
      </g>
      <g>
        <rect x="372" y="414" width="260" height="48" rx="12" data-layout-item="check-grid-top" data-fill-role="strip" fill="#F7F9FB" data-stroke-role="rule" stroke="#DEE0E2"/>
        <circle cx="396" cy="438" r="12" data-fill-role="icon-tint" fill="#EAF0F6"/>
        <path d="M390 438 L394 442 L402 433" data-stroke-role="focus" stroke="#2E6DA4" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="420" y="438" font-size="14" dominant-baseline="central" data-fill-role="ink" fill="#252B35">글자가 넘치지 않나</text>
      </g>
      <g>
        <rect x="88" y="478" width="260" height="48" rx="12" data-layout-item="check-grid-bottom" data-fill-role="strip" fill="#F7F9FB" data-stroke-role="rule" stroke="#DEE0E2"/>
        <circle cx="112" cy="502" r="12" data-fill-role="icon-tint" fill="#EAF0F6"/>
        <path d="M106 502 L110 506 L118 497" data-stroke-role="focus" stroke="#2E6DA4" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="136" y="502" font-size="14" dominant-baseline="central" data-fill-role="ink" fill="#252B35">아이콘이 맞나</text>
      </g>
      <g>
        <rect x="372" y="478" width="260" height="48" rx="12" data-layout-item="check-grid-bottom" data-fill-role="strip" fill="#F7F9FB" data-stroke-role="rule" stroke="#DEE0E2"/>
        <circle cx="396" cy="502" r="12" data-fill-role="icon-tint" fill="#EAF0F6"/>
        <path d="M390 502 L394 506 L402 497" data-stroke-role="focus" stroke="#2E6DA4" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="420" y="502" font-size="14" dominant-baseline="central" data-fill-role="ink" fill="#252B35">폰트가 달라지지 않나</text>
      </g>
    </g>

    <g data-entity="verified-result">
      <rect x="56" y="606" width="280" height="170" rx="18" data-layout-item="result-row" data-fill-role="surface" fill="#FFFFFF"
        data-stroke-role="positive" stroke="#3F8F72" stroke-width="2"/>
      <circle cx="196" cy="648" r="22" data-fill-role="compute-fill" fill="#ECF4F1"/>
      <path d="M186 648 L193 655 L207 639" data-stroke-role="positive" stroke="#3F8F72" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="196" y="692" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" data-fill-role="ink" fill="#252B35">문제 없음</text>
      <text x="196" y="726" font-size="14" text-anchor="middle" dominant-baseline="central" data-fill-role="muted" fill="#636A75">SVG + 확인표(receipt)</text>
    </g>

    <g data-entity="explicit-stop">
      <rect x="384" y="606" width="280" height="170" rx="18" data-layout-item="result-row" data-fill-role="surface" fill="#FFFFFF"
        data-stroke-role="warning" stroke="#B08434" stroke-width="2"/>
      <circle cx="524" cy="648" r="22" data-fill-role="surface-tint" fill="#E4EDF3"/>
      <g data-icon-id="flag" transform="translate(512 636)">
        <path d="M6 3 V21 M6 4 H18 L15 8 L18 12 H6" data-stroke-role="warning" stroke="#B08434" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="524" y="692" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" data-fill-role="ink" fill="#252B35">문제 발견</text>
      <text x="524" y="722" font-size="14" text-anchor="middle" dominant-baseline="central" data-fill-role="muted" fill="#636A75">멈추거나</text>
      <text x="524" y="744" font-size="14" text-anchor="middle" dominant-baseline="central" data-fill-role="muted" fill="#636A75">여러 장으로 나눔</text>
    </g>
  </g>

  <g data-layer="annotations">
    <rect x="56" y="810" width="608" height="54" rx="14" data-fill-role="strip" fill="#F7F9FB" data-stroke-role="rule" stroke="#DEE0E2"/>
    <text x="360" y="837" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central" data-fill-role="ink" fill="#252B35">결함 있는 결과물이 ‘성공’으로 오판되지 않게 한다</text>
  </g>
</svg>
