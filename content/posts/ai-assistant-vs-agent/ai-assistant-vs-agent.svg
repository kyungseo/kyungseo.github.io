<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img"
     style="font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title>도구보다 중요한 것은 다음 행동을 누가 정하느냐입니다</title>
  <desc>Assistant에서는 사용자가 요청과 응답 사이에서 다음 행동을 정한다. Agent에서는 사용자가 목표와 경계를 정하고 Runtime이 다음 행동 선택, 도구 실행, 결과 확인, 완료 판단을 반복한다.</desc>

  <defs>
    <marker id="ah-data" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11.25" markerHeight="11.25"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#636A75" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" data-stroke-role="data-line"/>
    </marker>
    <marker id="ah-edge" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11.25" markerHeight="11.25"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#2E6DA4" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" data-stroke-role="edge-line"/>
    </marker>
    <marker id="ah-api" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9.9" markerHeight="9.9"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#5B54A8" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" data-stroke-role="api-line"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="900" fill="#F7F7F5" data-fill-role="canvas"/>

  <!-- Header: PageFrame social-4x5, H-C two-line cluster -->
  <text x="52" y="43" font-size="14" letter-spacing="1.5" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">AI ASSISTANT VS AGENT</text>
  <rect x="36" y="58" width="4" height="68" rx="2" fill="#2E6DA4" data-fill-role="focus"/>
  <text x="52" y="75" font-size="28" font-weight="700" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">도구보다 중요한 것은</text>
  <text x="52" y="109" font-size="28" font-weight="700" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">다음 행동을 누가 정하느냐입니다</text>
  <text x="52" y="143" font-size="14" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">같은 모델과 도구도 실행 구조에 따라 역할이 달라집니다</text>

  <!-- Assistant lane -->
  <rect x="36" y="188" width="648" height="230" rx="18"
        fill="#F4F5F5" stroke="#B9BCC1" stroke-width="1.2"
        data-fill-role="data-fill" data-stroke-role="external-line"
        data-layout-container="assistant-panel" data-min-pad="20" data-min-visual-pad="10"
        data-symmetry="x" data-symmetry-tol="4" data-layout-count="3"
        data-reserve-top="68" data-title-gap="14" data-content-pad-top="12"/>
  <text x="60" y="222" font-size="20" font-weight="700" dominant-baseline="central"
        fill="#363A40" data-fill-role="data-ink" data-layout-title="assistant-panel">Assistant</text>
  <text x="160" y="222" font-size="14" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">사용자가 매 단계의 다음 행동을 선택</text>

  <path d="M234 324 H268" fill="none" stroke="#636A75" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#ah-data)" data-stroke-role="data-line"/>
  <path d="M452 324 H486" fill="none" stroke="#636A75" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#ah-data)" data-stroke-role="data-line"/>

  <rect x="60" y="270" width="166" height="108" rx="14"
        fill="#FFFFFF" stroke="#636A75" stroke-width="1.2"
        data-fill-role="surface" data-stroke-role="data-line"
        data-layout-parent="assistant-panel" data-layout-item="assistant-row"
        data-layout-group="assistant-row" data-distribution="equal-gap" data-axis="x"
        data-group-count="3" data-gap-tol="1"/>
  <circle cx="88" cy="298" r="14" fill="#636A75" data-fill-role="muted"/>
  <text x="88" y="298" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#FFFFFF" data-fill-role="on-focus">1</text>
  <text x="143" y="319" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">사용자 요청</text>
  <text x="143" y="346" font-size="13" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">이번 단계의 지시</text>

  <rect x="278" y="270" width="166" height="108" rx="14"
        fill="#FFFFFF" stroke="#636A75" stroke-width="1.2"
        data-fill-role="surface" data-stroke-role="data-line"
        data-layout-parent="assistant-panel" data-layout-item="assistant-row"/>
  <circle cx="306" cy="298" r="14" fill="#636A75" data-fill-role="muted"/>
  <text x="306" y="298" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#FFFFFF" data-fill-role="on-focus">2</text>
  <text x="361" y="319" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">AI 응답</text>
  <text x="361" y="346" font-size="13" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">답변·도구 결과</text>

  <rect x="496" y="270" width="166" height="108" rx="14"
        fill="#FFFFFF" stroke="#636A75" stroke-width="1.2"
        data-fill-role="surface" data-stroke-role="data-line"
        data-layout-parent="assistant-panel" data-layout-item="assistant-row"/>
  <circle cx="524" cy="298" r="14" fill="#636A75" data-fill-role="muted"/>
  <text x="524" y="298" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#FFFFFF" data-fill-role="on-focus">3</text>
  <text x="579" y="319" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">사용자 판단</text>
  <text x="579" y="346" font-size="13" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">다음 지시를 선택</text>

  <text x="360" y="398" font-size="13.5" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">도구를 사용해도 진행권은 사용자에게 있습니다</text>

  <!-- Agent lane -->
  <rect x="36" y="442" width="648" height="286" rx="18"
        fill="#EAF0F6" stroke="#2E6DA4" stroke-width="1.4"
        data-fill-role="edge-fill" data-stroke-role="edge-line"
        data-layout-container="agent-panel" data-min-pad="20" data-min-visual-pad="10"
        data-symmetry="x" data-symmetry-tol="4" data-layout-count="4"
        data-reserve-top="68" data-title-gap="14" data-content-pad-top="12"/>
  <text x="60" y="476" font-size="20" font-weight="700" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink" data-layout-title="agent-panel">Agent</text>
  <text x="128" y="476" font-size="14" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">목표와 경계 안에서 Runtime이 반복</text>

  <path d="M190 580 H210" fill="none" stroke="#2E6DA4" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#ah-edge)" data-stroke-role="edge-line"/>
  <path d="M348 580 H368" fill="none" stroke="#2E6DA4" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#ah-edge)" data-stroke-role="edge-line"/>
  <path d="M506 580 H526" fill="none" stroke="#2E6DA4" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#ah-edge)" data-stroke-role="edge-line"/>
  <path d="M596 646 V668 H280 V646" fill="none" stroke="#5B54A8" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"
        marker-end="url(#ah-api)" data-stroke-role="api-line"/>

  <rect x="62" y="522" width="120" height="116" rx="14"
        fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.2"
        data-fill-role="surface" data-stroke-role="edge-line"
        data-layout-parent="agent-panel" data-layout-item="agent-row"
        data-layout-group="agent-row" data-distribution="equal-gap" data-axis="x"
        data-group-count="4" data-gap-tol="1"/>
  <circle cx="86" cy="548" r="13" fill="#2E6DA4" data-fill-role="focus"/>
  <text x="86" y="548" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#FFFFFF" data-fill-role="on-focus">1</text>
  <text x="122" y="588" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">목표·경계</text>
  <text x="122" y="616" font-size="14" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">사용자가 설정</text>

  <rect x="220" y="522" width="120" height="116" rx="14"
        fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.2"
        data-fill-role="surface" data-stroke-role="edge-line"
        data-layout-parent="agent-panel" data-layout-item="agent-row"/>
  <circle cx="244" cy="548" r="13" fill="#2E6DA4" data-fill-role="focus"/>
  <text x="244" y="548" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#FFFFFF" data-fill-role="on-focus">2</text>
  <text x="280" y="588" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">다음 행동</text>
  <text x="280" y="616" font-size="14" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">Runtime이 선택</text>

  <rect x="378" y="522" width="120" height="116" rx="14"
        fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.2"
        data-fill-role="surface" data-stroke-role="edge-line"
        data-layout-parent="agent-panel" data-layout-item="agent-row"/>
  <circle cx="402" cy="548" r="13" fill="#2E6DA4" data-fill-role="focus"/>
  <text x="402" y="548" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#FFFFFF" data-fill-role="on-focus">3</text>
  <text x="438" y="588" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">도구 실행</text>
  <text x="438" y="616" font-size="14" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">권한·승인 검사</text>

  <rect x="536" y="522" width="120" height="116" rx="14"
        fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.2"
        data-fill-role="surface" data-stroke-role="edge-line"
        data-layout-parent="agent-panel" data-layout-item="agent-row"/>
  <circle cx="560" cy="548" r="13" fill="#2E6DA4" data-fill-role="focus"/>
  <text x="560" y="548" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#FFFFFF" data-fill-role="on-focus">4</text>
  <text x="596" y="588" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">결과 확인</text>
  <text x="596" y="616" font-size="14" text-anchor="middle" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">완료·중지 판단</text>

  <text x="438" y="690" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central"
        fill="#322E5C" data-fill-role="api-ink">완료되지 않았다면 반복</text>
  <text x="360" y="714" font-size="13.5" text-anchor="middle" dominant-baseline="central"
        fill="#193C5A" data-fill-role="edge-ink">경계에 닿으면 멈추고 사용자에게 돌아옵니다</text>

  <!-- Takeaway -->
  <rect x="36" y="750" width="648" height="40" rx="12"
        fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1"
        data-fill-role="surface" data-stroke-role="rule"/>
  <circle cx="60" cy="770" r="6" fill="#2E6DA4" data-fill-role="focus"/>
  <text x="78" y="770" font-size="14" font-weight="700" dominant-baseline="central"
        fill="#252B35" data-fill-role="ink">같은 모델과 도구라도 실행 구조가 다르면 역할이 달라집니다</text>

  <text x="36" y="836" font-size="12" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">실선: 진행 · 점선: Runtime 내부 반복</text>
  <text x="684" y="856" font-size="12" text-anchor="end" dominant-baseline="central"
        fill="#636A75" data-fill-role="muted">kyungseo.github.io</text>
</svg>
